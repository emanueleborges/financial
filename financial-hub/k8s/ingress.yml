apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: financial-hub-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  rules:
    - host: financial-hub.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: financial-hub-service
                port:
                  number: 80
  tls:
    - hosts:
        - financial-hub.local
      secretName: financial-hub-tls
