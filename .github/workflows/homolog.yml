name: Homologação local (Kind)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  homolog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - uses: helm/kind-action@v1
        with:
          cluster_name: fh-homolog
      - name: Render e aplicar chart
        run: |
          helm lint infra/k8s/helm/financial-hub
          helm template fh infra/k8s/helm/financial-hub | kubectl apply --dry-run=client -f -
          echo "Homologação: manifests válidos (dry-run). Stack completa sobe com docker compose local."
