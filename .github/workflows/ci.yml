name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Testes da API
        working-directory: backend
        run: mvn -B test

  notification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Testes do notification-service
        working-directory: services/notification-service
        run: mvn -B test

  angular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Angular
        working-directory: web-angular
        run: |
          npm install
          npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint + template
        run: |
          helm lint infra/k8s/helm/financial-hub
          helm template fh infra/k8s/helm/financial-hub > /tmp/fh.yaml

  images:
    runs-on: ubuntu-latest
    needs: [backend, notification, angular]
    steps:
      - uses: actions/checkout@v4
      - name: Build imagens Docker
        run: |
          docker build -t financial-hub:ci -f backend/docker/Dockerfile backend
          docker build -t notification-service:ci ./services/notification-service
          docker build -t web-angular:ci ./web-angular
