name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Testes da API
        working-directory: backend
        run: mvn -B test

  notification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Testes do notification-service
        working-directory: services/notification-service
        run: mvn -B test

  angular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Angular
        working-directory: web-angular
        run: |
          npm install
          npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint + template
        run: |
          helm lint infra/k8s/helm/financial-hub
          helm template fh infra/k8s/helm/financial-hub > /tmp/fh.yaml

  images:
    runs-on: ubuntu-latest
    needs: [backend, notification, angular]
    steps:
      - uses: actions/checkout@v4
      - name: Build imagens Docker
        run: |
          docker build -t financial-hub:ci -f backend/docker/Dockerfile backend
          docker build -t notification-service:ci ./services/notification-service
          docker build -t web-angular:ci ./web-angular

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [backend, notification]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: JaCoCo (API)
        working-directory: backend
        run: mvn -B test
      - name: JaCoCo (notification-service)
        working-directory: services/notification-service
        run: mvn -B test
      - name: Scan (SonarCloud)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'emanueleborges' }}
      - name: Quality Gate
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
      - name: Sem SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::Defina o secret SONAR_TOKEN (SonarCloud) para publicar a análise. Spec: specs/infra/sonar.md"
