# Modelo do Secret do Kubernetes. Copie para secret.yml (ignorado pelo git), troque os valores e aplique:
#   cp k8s/secret.example.yml k8s/secret.yml
#   kubectl apply -f k8s/secret.yml
# JWT_SECRET: no mínimo 32 caracteres aleatórios (HS256), ex.: openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: financial-hub-secret
type: Opaque
stringData:
  DB_USER: CHANGE_ME
  DB_PASSWORD: CHANGE_ME
  JWT_SECRET: CHANGE_ME
  AWS_ACCESS_KEY_ID: CHANGE_ME
  AWS_SECRET_ACCESS_KEY: CHANGE_ME
