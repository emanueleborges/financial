apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-hub
  labels:
    app: financial-hub
spec:
  replicas: 3
  selector:
    matchLabels:
      app: financial-hub
  template:
    metadata:
      labels:
        app: financial-hub
    spec:
      containers:
        - name: financial-hub
          image: financial-hub:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: financial-hub-config
            - secretRef:
                name: financial-hub-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
